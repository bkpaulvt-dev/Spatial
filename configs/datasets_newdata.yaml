# Registry of the NEW datasets (new-datasets extension). Kept apart from configs/datasets.yaml on purpose: scripts/stats_cluster_aware.py
# enumerates that file as the bootstrap groups of the original analysis, which must not change. Read by scripts/newdata_queue.py.
# Every section is split "test": nothing is tuned on any new section. verified: false = to be confirmed against the source before submission.
schema_version: 1
datasets:
  sim_bands:
    name: Simulated tissue, geometry A "layered bands" (domain-size experiment)
    technology: simulation (self-written negative-binomial generator, scripts/simulate_domains.py)
    generation: square lattice 120 x 120 (14,400 spots, spacing 1), whole-transcriptome-like counts (5,000 genes)
    species: none (profiles from human DLPFC section 151507, layers L1-L6, a dev section)
    resolution: spot spacing 1 (no physical unit)
    n_sections: 20
    n_domains: 6
    label_provenance: {class: simulated, verified: true, note: "domains known by construction: 6 domains repeated m times as parallel bands (m = 1, 2, 4, 7; band width about 20, 10, 5, 2.9 rows); design fixed in docs/PREREGISTERED_SIM.md before any simulation result existed"}
    settings_note: "whole-transcriptome path as DLPFC/breast/Stereo-seq (spatialbench.data.WHOLE_TRANSCRIPTOME, not VISIUM so BayesSpace is not run); BASS keeps its DLPFC branch, as for breast cancer and Stereo-seq (scripts/run_r_method.R)"
    source: {counts: "data/Sim/sim_bands/<section>.h5ad written by scripts/simulate_domains.py", citation: "this work; profiles from Maynard et al., Nat Neurosci 2021 (DLPFC 151507)"}
    license: {status: not_applicable, note: "synthetic data; reference profiles from the public spatialLIBD data"}
    sections:
      "m1_r0": {split: test}
      "m1_r1": {split: test}
      "m1_r2": {split: test}
      "m1_r3": {split: test}
      "m1_r4": {split: test}
      "m2_r0": {split: test}
      "m2_r1": {split: test}
      "m2_r2": {split: test}
      "m2_r3": {split: test}
      "m2_r4": {split: test}
      "m4_r0": {split: test}
      "m4_r1": {split: test}
      "m4_r2": {split: test}
      "m4_r3": {split: test}
      "m4_r4": {split: test}
      "m7_r0": {split: test}
      "m7_r1": {split: test}
      "m7_r2": {split: test}
      "m7_r3": {split: test}
      "m7_r4": {split: test}
  sim_blocks:
    name: Simulated tissue, geometry B "random blocks" (domain-size experiment)
    technology: simulation (self-written negative-binomial generator, scripts/simulate_domains.py)
    generation: square lattice 120 x 120 (14,400 spots, spacing 1), whole-transcriptome-like counts (5,000 genes)
    species: none (profiles from human DLPFC section 151507, layers L1-L6, a dev section)
    resolution: spot spacing 1 (no physical unit)
    n_sections: 25
    n_domains: 6
    label_provenance: {class: simulated, verified: true, note: "domains known by construction: w x w blocks (w = 3, 5, 8, 12, 20) each assigned one of 6 domains at random (all 6 present)"}
    settings_note: "same as sim_bands"
    source: {counts: "data/Sim/sim_blocks/<section>.h5ad written by scripts/simulate_domains.py", citation: "this work"}
    license: {status: not_applicable}
    sections:
      "w3_r0": {split: test}
      "w3_r1": {split: test}
      "w3_r2": {split: test}
      "w3_r3": {split: test}
      "w3_r4": {split: test}
      "w5_r0": {split: test}
      "w5_r1": {split: test}
      "w5_r2": {split: test}
      "w5_r3": {split: test}
      "w5_r4": {split: test}
      "w8_r0": {split: test}
      "w8_r1": {split: test}
      "w8_r2": {split: test}
      "w8_r3": {split: test}
      "w8_r4": {split: test}
      "w12_r0": {split: test}
      "w12_r1": {split: test}
      "w12_r2": {split: test}
      "w12_r3": {split: test}
      "w12_r4": {split: test}
      "w20_r0": {split: test}
      "w20_r1": {split: test}
      "w20_r2": {split: test}
      "w20_r3": {split: test}
      "w20_r4": {split: test}
  allenmerfish:
    name: Mouse whole brain, coronal sections (MERFISH, Allen Brain Cell Atlas Zhuang-ABCA-1)
    technology: MERFISH
    generation: imaging, targeted panel (1,122 genes), single cell
    species: mouse
    tissue: whole brain, coronal sections of one adult mouse (ABCA-1)
    resolution: single cell (section-plane coordinates in mm)
    n_sections: 3
    n_domains: {"ABCA1-066": 11, "ABCA1-085": 11, "ABCA1-103": 7}
    n_obs: {"ABCA1-066": 26940, "ABCA1-085": 32047, "ABCA1-103": 29220}
    label_provenance: {class: reference_atlas, verified: true,
      note: "per-cell parcellation index from the registration of each MERFISH section to the Allen CCFv3 (ccf_coordinates.csv of the ABC Atlas, Zhang et al. Nature 2023), mapped to the CCF term set 'division' (Allen-CCF-2020 parcellation_to_parcellation_term_membership); registration, not clustering. Divisions with >= 1% of the section's cells are the domains; cells of other divisions, of placeholder divisions named 'unassigned' (not anatomical), and cells without a CCF row are label NA (kept in the data, never scored). The exclusion of the 'unassigned' placeholders was decided before any method ran on these sections."}
    selection_rule: "sections of Zhuang-ABCA-1 with > 20,000 cells (72 candidates), ordered by median CCF x (anterior-posterior; Spearman 1.0 with the section number), the 25th, 50th and 75th percentile by nearest rank: Zhuang-ABCA-1.066, .085, .103 (results/newdata_allen_sections.json)"
    settings_note: "targeted-panel path (all 1,122 genes, library-size normalised, log, scale, 50 PCs), through the CSV fallback of spatialbench.data.load_section; BASS targeted branch (C = 20), as for MERFISH animal 1. Dense CSV counts: scripts/newdata_allen.py --export"
    source: {counts: "https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/expression_matrices/Zhuang-ABCA-1/20230830/Zhuang-ABCA-1-raw.h5ad (raw counts, 1.2 GB)",
             labels: "metadata/Zhuang-ABCA-1-CCF/20230830/ccf_coordinates.csv + metadata/Allen-CCF-2020/20230630/parcellation_to_parcellation_term_membership.csv (same bucket); section-plane x, y from metadata/Zhuang-ABCA-1/20230830/cell_metadata.csv",
             citation: "Zhang et al., Nature 2023 (doi 10.1038/s41586-023-06808-9); Allen Brain Cell Atlas (Yao et al., Nature 2023)"}
    license: {status: to_check, note: "no licence statement found on the pages read; Allen Institute terms of use apply; confirm before redistribution (the derived CSVs are not committed)"}
    sections:
      "ABCA1-066": {split: test}
      "ABCA1-085": {split: test}
      "ABCA1-103": {split: test}

  osmfish:
    name: Mouse somatosensory cortex (osmFISH; SDMBench release)
    technology: osmFISH
    generation: imaging, targeted panel (33 genes), single cell
    species: mouse
    tissue: somatosensory cortex (one section, 4,839 cells after SDMBench exclusion)
    resolution: single cell
    n_sections: 1
    n_domains: {"osmFISH": 11}
    label_provenance: {class: unknown, verified: false,
      note: "obs['Region'] of the SDMBench file: 11 anatomical region names (Layer 2-3 medial/lateral, Layer 3-4, 4, 5, 6, White matter, Hippocampus, Ventricle, Pia Layer 1, Internal Capsule Caudoputamen); labels from SDMBench, derivation not fully documented (the region annotation goes back to Codeluppi et al. 2018, Nat Methods, but SDMBench does not state how its file was derived). Reported as a separate, clearly labelled group."}
    settings_note: "targeted-panel path (all 33 genes, 50 PCs capped at n_genes - 1), CSV fallback of spatialbench.data.load_section. The SDMBench matrix is library-size normalised (every cell sums to 5,328), not raw counts: analysed as released (deviation)."
    source: {counts: "https://ndownloader.figshare.com/files/40038577 (osmfish_remove_excluded.h5ad, Figshare article 22565194, md5 b087669928e888619ff003bb2d533a7c)", labels: "same file, obs['Region']",
             citation: "Yuan et al., Nat Methods 2024 (SDMBench); Codeluppi et al., Nat Methods 2018"}
    license: {status: CC-BY-4.0, note: "Figshare licence of the SDMBench deposit (CC BY 4.0); derived CSVs are not committed"}
    sections:
      "osmFISH": {split: test}
  baristaseq:
    name: Mouse primary visual cortex VISp (BaristaSeq; SDMBench release)
    technology: BaristaSeq
    generation: in situ sequencing, targeted panel (79 genes), single cell
    species: mouse
    tissue: primary visual cortex (3 slices; 1,525 / 2,042 / 1,690 cells)
    resolution: single cell
    n_sections: 3
    n_domains: {"Slice_1": 6, "Slice_2": 6, "Slice_3": 6}
    label_provenance: {class: unknown, verified: false,
      note: "obs['layer'] of the SDMBench files: cortical layers VISp_I, II/III, IV, V, VI and white matter; labels from SDMBench, derivation not fully documented (provenance: anatomical by name, derivation undocumented). Checked on all three slices: the layer labels follow depth below the pia (obs['depth_um']; e.g. Slice_1: I 23-130, II/III 129-440, IV 411-682, V 646-950, VI 919-1223, wm 1183-1308 um) but the depth ranges of neighbouring layers overlap slightly, so they are a delineation that follows depth, not strict depth bins; the per-cell column 'Dist to pia' also exists. Spatial coordinates (obsm['spatial']) equal x_um, y_um. The md5 of all four SDMBench files was checked against the Figshare listing. Reported as a separate, clearly labelled group."}
    settings_note: "targeted-panel path (all 79 genes, 50 PCs capped at n_genes - 1), CSV fallback; integer counts as released."
    source: {counts: "https://ndownloader.figshare.com/files/40017088, 40017172, 40017175 (Slice_1/2/3_removed.h5ad, Figshare article 22550074)", labels: "same files, obs['layer']",
             citation: "Yuan et al., Nat Methods 2024 (SDMBench); Sun et al., 2021 (BaristaSeq VISp)"}
    license: {status: CC-BY-4.0, note: "Figshare licence of the SDMBench deposit (CC BY 4.0); derived CSVs are not committed"}
    sections:
      "Slice_1": {split: test}
      "Slice_2": {split: test}
      "Slice_3": {split: test}
