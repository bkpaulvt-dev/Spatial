# Dataset registry for the benchmark. Every entry records technology, tissue, label provenance and the
# frozen development/test split. `verified: false` means the field was filled from memory of the
# source publication and MUST be confirmed against the original paper before submission.
# Label provenance classes: expert (drawn/assigned by anatomists/pathologists), marker (derived from
# known marker genes), reference_atlas (registered to an anatomical reference), algorithm (obtained by
# a clustering/segmentation algorithm: circular for evaluating other algorithms), unknown.
schema_version: 1
datasets:
  dlpfc:
    name: Human dorsolateral prefrontal cortex (spatialLIBD)
    technology: 10x Visium
    generation: spot-based, whole-transcriptome
    species: human
    tissue: dorsolateral prefrontal cortex
    resolution: 55 um spots, ~100 um centre-to-centre
    n_sections: 12
    n_domains: {donor2: 5, other: 7}
    label_provenance: {class: expert, verified: false,
      note: "layer_guess_reordered: manual cortical layer annotation (Maynard et al. 2021) from cytoarchitecture and marker genes; confirm in the source paper"}
    source: {counts: "https://spatial-dlpfc.s3.us-east-2.amazonaws.com/h5/<id>_filtered_feature_bc_matrix.h5",
             labels: "JinmiaoChenLab/SEDR_analyses data/DLPFC/<id>/metadata.tsv",
             citation: "Maynard et al., Nat Neurosci 2021"}
    license: {status: to_check}
    sections:
      "151507": {donor: Br5292, split: dev}
      "151508": {donor: Br5292, split: dev}
      "151509": {donor: Br5292, split: dev}
      "151510": {donor: Br5292, split: dev}
      "151669": {donor: Br5595, split: test}
      "151670": {donor: Br5595, split: test}
      "151671": {donor: Br5595, split: test}
      "151672": {donor: Br5595, split: test}
      "151673": {donor: Br8100, split: test}
      "151674": {donor: Br8100, split: test}
      "151675": {donor: Br8100, split: test}
      "151676": {donor: Br8100, split: test}
  starmap:
    name: Mouse medial prefrontal cortex (STARmap)
    technology: STARmap
    generation: imaging, targeted panel (166 genes), single cell
    species: mouse
    tissue: medial prefrontal cortex
    resolution: single cell
    n_sections: 3
    label_provenance: {class: unknown, verified: false,
      note: "layer labels as distributed in the BASS-Analysis repository (column z); how they were derived is not yet confirmed; classify before ranking on this dataset"}
    source: {counts: "BASS-Analysis data/starmap_mpfc.RData", citation: "Wang et al., Science 2018; Li & Zhou, Genome Biol 2022"}
    license: {status: to_check}
    sections:
      "20180417_BZ5_control": {split: dev}
      "20180419_BZ9_control": {split: test}
      "20180424_BZ14_control": {split: test}
  merfish:
    name: Mouse hypothalamic preoptic region (MERFISH, animal 1)
    technology: MERFISH
    generation: imaging, targeted panel (155 genes), single cell
    species: mouse
    tissue: hypothalamic preoptic region
    resolution: single cell
    n_sections: 5
    label_provenance: {class: reference_atlas, verified: false,
      note: "anatomical region labels distributed in BASS-Analysis (column z), believed to come from the original MERFISH study's registration to an anatomical atlas; confirm"}
    source: {counts: "BASS-Analysis data/MERFISH_Animal1.RData", citation: "Moffitt et al., Science 2018; Li & Zhou, Genome Biol 2022"}
    license: {status: to_check}
    sections:
      "-0.04": {split: dev}
      "-0.09": {split: test}
      "-0.14": {split: test}
      "-0.19": {split: test}
      "-0.24": {split: test}
  # Held-out datasets added after the baseline settings were frozen: every section is split "test" (nothing is tuned on them).
  # Download: scripts/download_new_datasets.py; caches for the training-free scripts: scripts/prepare_new_datasets.py.
  brca:
    name: Human breast cancer (10x Visium, Block A Section 1)
    technology: 10x Visium
    generation: spot-based, whole-transcriptome
    species: human
    tissue: breast cancer (ductal carcinoma in situ and invasive ductal carcinoma)
    resolution: 55 um spots, ~100 um centre-to-centre
    n_sections: 1
    n_domains: 20
    label_provenance: {class: expert, verified: false,
      note: "metadata.tsv column fine_annot_type (20 regions: DCIS/LCIS_1-5, Healthy_1-2, IDC_1-7, Tumor_edge_1-6; all 3798 spots annotated); column annot_type is the 4-class coarse version (Healthy, Tumor, Invasive, Surrounding tumor). Described by the source (SEDR_analyses) as a manual pathologist annotation; confirm who drew it and whether expression clusters were used"}
    coordinates: "obsm['spatial'] = (pxl_col_in_fullres, pxl_row_in_fullres) from spatial/tissue_positions_list.csv (full-resolution pixels; median nearest-neighbour spacing 273 px); obs array_row/array_col for BayesSpace"
    source: {counts: "https://cf.10xgenomics.com/samples/spatial-exp/1.1.0/V1_Breast_Cancer_Block_A_Section_1/V1_Breast_Cancer_Block_A_Section_1_filtered_feature_bc_matrix.h5",
             spatial: "https://cf.10xgenomics.com/samples/spatial-exp/1.1.0/V1_Breast_Cancer_Block_A_Section_1/V1_Breast_Cancer_Block_A_Section_1_spatial.tar.gz",
             labels: "JinmiaoChenLab/SEDR_analyses (commit 00084465) data/BRCA1/metadata.tsv",
             citation: "10x Genomics, Space Ranger 1.1.0 demonstration dataset V1_Breast_Cancer_Block_A_Section_1; annotation from SEDR_analyses (Xu et al., Genome Med 2024)"}
    license: {status: to_check, note: "10x Genomics public datasets are distributed under CC BY 4.0 (to confirm); SEDR_analyses has no explicit licence for the annotation"}
    sections:
      "block_a_1": {split: test}
  stereo:
    name: Mouse embryo (Stereo-seq MOSTA atlas, bin50)
    technology: Stereo-seq
    generation: bin-based (bin50 = 50 x 50 DNB, ~25 um, square grid), whole-transcriptome
    species: mouse
    tissue: whole embryo (E9.5, E10.5)
    resolution: bin50, ~25 um
    n_sections: 3
    n_domains: {"E9.5_E1S1": 12, "E10.5_E2S1": 18, "E10.5_E1S1": 13}
    n_obs: {"E9.5_E1S1": 5913, "E10.5_E2S1": 8494, "E10.5_E1S1": 18408}
    label_provenance: {class: algorithm, verified: false,
      note: "obs['annotation'] of the MOSTA h5ad (original tissue annotation of Chen et al. 2022), used as ground truth. As far as we know the MOSTA tissue domains were obtained by unsupervised clustering of the bin50 expression and then named by marker genes and anatomy, i.e. partly algorithm-derived (circular for clustering methods); confirm in the paper's methods before ranking on this dataset"}
    coordinates: "obsm['spatial'] of the h5ad (bin50 grid coordinates); bins with zero counts are dropped; raw counts from layers['count']"
    source: {counts: "https://ftp.cngb.org/pub/SciRAID/stomics/STDS0000058/stomics/<section>.MOSTA.h5ad",
             labels: "same file, obs['annotation']",
             citation: "Chen et al., Cell 2022 (MOSTA, CNGB STOmics DB STDS0000058)"}
    license: {status: to_check, note: "CNGB STOmics DB terms of use"}
    sections:
      "E9.5_E1S1": {split: test}
      "E10.5_E2S1": {split: test}
      "E10.5_E1S1": {split: test}
